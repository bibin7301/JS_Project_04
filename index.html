<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css"
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <title>Counter App</title>
</head>

<body class="bg-gray-900 flex lg:items-center justify-center lg:h-screen">

    <div class="bg-sky-200 shadow-lg rounded-2xl p-8 text-center w-85 lg:w-90 mt-6 mb-5">





        <h1 class="text-4xl font-bold  text-red-900">
            Counter App
        </h1>

        <!-- Counter Value -->
        <h2 id="count" class="text-9xl font-bold text-blue-700 mb-5 ">
            0
        </h2>

        <!-- Buttons -->
        <div class="flex justify-center gap-4">

            <button id="decrease" class="bg-red-900 hover:bg-red-600 text-white px-4 py-2 rounded-lg text-xl">
                Decrease
            </button>

            <button id="reset" class="bg-gray-500 hover:bg-blue-600 text-white px-4 py-2 rounded-lg">
                Reset
            </button>

            <button id="increase" class="bg-red-900 hover:bg-green-500 text-white px-4 py-2 rounded-lg text-xl">
                Increase
            </button>



            <script src="script.js"></script>
</body>

</html>
